<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Sheet Form</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f4f4;
    }

    .container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      width: 300px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    #message {
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>User Form</h2>

    <input type="text" id="name" placeholder="Enter Name" />
    <input type="number" id="number" placeholder="Age" />

    <button onclick="submitForm()">Submit</button>

    <p id="message"></p>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbySAAYjvOWqy4dPEb_yCUPvcCbhQbjx0w4Qlp34IOKgv6udcAoyQpxfJGC1AtXY_yw-Ow/exec";

    async function submitForm() {
      const name = document.getElementById("name").value;
      const number = document.getElementById("number").value;

      if (!name || !number) {
        document.getElementById("message").innerText =
          "Please fill all fields";
        return;
      }

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            name,
            number
          })
        });

        document.getElementById("message").innerText =
          "Submitted Successfully";

        document.getElementById("name").value = "";
        document.getElementById("number").value = "";

      } catch (error) {
        document.getElementById("message").innerText =
          "Submission Failed";
      }
    }
  </script>

</body>
</html>
